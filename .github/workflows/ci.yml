name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Link-target scheme allowlist parity (SQL vs TS)
        run: npm run test:link-target-parity

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — this repo is small enough that a full scan every
          # run is fast and simpler/more robust than hand-rolling diff-only
          # ranges (which have edge cases on a repo's first push per branch).
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --redact --verbose

# No `deploy` job right now — the previous HostersPK SSH deploy step was
# removed because the repo has no deploy secrets configured (it never
# actually succeeded) and the hosting target isn't finalized. See
# docs/SETUP.md §9 for the HostersPK-specific steps kept as reference, and
# scripts/hosterspk-entry.mjs for the HOST-binding fix that's worth
# reapplying on whatever host is chosen if it's similar shared/Passenger
# hosting behind a reverse proxy. Wire a new `deploy` job here, gated on
# `github.ref == 'refs/heads/main'` like the old one was, once a host is
# chosen and its secrets are added under Settings → Secrets and variables
# → Actions.
